[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-tools"
version = "0.1.0"
description = "email tools backends"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/email_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
